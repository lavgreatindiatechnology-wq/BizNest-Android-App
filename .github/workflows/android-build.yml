name: Build BizNest Android APK and AAB

on:
  workflow_dispatch:

jobs:
  build:
    name: Build BizNest APK and AAB
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Check Project
        run: |
          echo "===== PROJECT FILES ====="
          ls -la
          echo "===== APP FILES ====="
          ls -la app
          echo "===== GRADLE VERSION ====="
          gradle --version

      - name: Build Debug APK
        run: |
          gradle clean
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build Release AAB
        run: |
          gradle :app:bundleRelease --no-daemon --stacktrace

      - name: Upload BizNest APK
        uses: actions/upload-artifact@v4
        with:
          name: BizNest-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload BizNest AAB
        uses: actions/upload-artifact@v4
        with:
          name: BizNest-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
